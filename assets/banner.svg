<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1138" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>

    <!-- Subtle Glow Filter -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pill-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .card-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #f8fafc;
    }
    .card-sub {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 11px;
      fill: #64748b;
    }

    /* CSS Animations for Dynamic Elements */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.2) translate(25px, -15px); opacity: 0.45; }
    }
    @keyframes pulseRing {
      0% { r: 50px; opacity: 0.7; }
      50% { r: 75px; opacity: 0.2; }
      100% { r: 50px; opacity: 0.7; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes floatPillDelayed {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(5px); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(400px); }
    }

    .dynamic-orb1 {
      animation: pulseOrb 9s ease-in-out infinite;
      transform-origin: 950px 140px;
    }
    .dynamic-orb2 {
      animation: pulseOrb2 11s ease-in-out infinite;
      transform-origin: 200px 240px;
    }
    .dynamic-ring {
      animation: pulseRing 6s ease-in-out infinite;
    }
    .animated-flow {
      stroke-dasharray: 8, 8;
      animation: dashMove 5s linear infinite;
    }
    .pill-float-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .pill-float-2 {
      animation: floatPillDelayed 6s ease-in-out infinite;
    }
    .pill-float-3 {
      animation: floatPill 5.5s ease-in-out infinite 1s;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="340" rx="16" fill="url(#cyber-grid)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS -->
  <g class="dynamic-orb1">
    <circle cx="980" cy="130" r="140" fill="#7c3aed" opacity="0.35" filter="url(#glow-blur)" />
    <circle cx="1060" cy="180" r="100" fill="#0284c7" opacity="0.3" filter="url(#glow-blur)" />
  </g>
  <g class="dynamic-orb2">
    <circle cx="160" cy="220" r="120" fill="#4f46e5" opacity="0.25" filter="url(#glow-blur)" />
  </g>

  <!-- Dynamic Animated Architecture Lines (Background) -->
  <g stroke-opacity="0.4" fill="none">
    <path d="M 680,240 C 780,240 820,130 920,130 L 1120,130" stroke="#6366f1" stroke-width="2" class="animated-flow" />
    <path d="M 720,270 C 800,270 850,220 950,220 L 1120,220" stroke="#06b6d4" stroke-width="1.8" class="animated-flow" />
    <path d="M 660,210 C 740,210 790,70 890,70 L 1120,70" stroke="#a855f7" stroke-width="1.5" class="animated-flow" />
  </g>

  <!-- Interactive/Dynamic Metric Nodes (Right Half - Behind Text Bounds) -->
  <g transform="translate(860, 45)">
    <!-- Node 1: Posture & Risk -->
    <g class="pill-float-1" transform="translate(40, 10)">
      <rect width="230" height="52" rx="10" fill="url(#card-grad)" stroke="#475569" stroke-width="1" />
      <circle cx="26" cy="26" r="10" fill="#10b981" fill-opacity="0.2" />
      <circle cx="26" cy="26" r="4" fill="#10b981" />
      <text x="48" y="24" class="card-title">Shadow IT &amp; AI Discovery</text>
      <text x="48" y="40" class="card-sub">Real-Time Continuous Auditing</text>
    </g>

    <!-- Node 2: Spend & Licenses -->
    <g class="pill-float-2" transform="translate(90, 85)">
      <rect width="210" height="52" rx="10" fill="url(#card-grad)" stroke="#475569" stroke-width="1" />
      <circle cx="26" cy="26" r="10" fill="#06b6d4" fill-opacity="0.2" />
      <circle cx="26" cy="26" r="4" fill="#06b6d4" />
      <text x="48" y="24" class="card-title">License Harvesting</text>
      <text x="48" y="40" class="card-sub">FinOps Spend Optimization</text>
    </g>

    <!-- Node 3: Identity & IGA -->
    <g class="pill-float-3" transform="translate(20, 160)">
      <rect width="230" height="52" rx="10" fill="url(#card-grad)" stroke="#475569" stroke-width="1" />
      <circle cx="26" cy="26" r="10" fill="#8b5cf6" fill-opacity="0.2" />
      <circle cx="26" cy="26" r="4" fill="#8b5cf6" />
      <text x="48" y="24" class="card-title">Access Governance (IGA)</text>
      <text x="48" y="40" class="card-sub">JML Workflow Automation</text>
    </g>
  </g>

  <!-- Pulsing Radar Target (Right Edge Decoration) -->
  <g transform="translate(1120, 130)">
    <circle cx="0" cy="0" r="6" fill="#8b5cf6" />
    <circle cx="0" cy="0" r="28" stroke="#8b5cf6" stroke-width="1" fill="none" opacity="0.4" />
    <circle cx="0" cy="0" r="50" stroke="#8b5cf6" stroke-width="1.2" fill="none" class="dynamic-ring" />
  </g>

  <!-- FOREGROUND BRANDING / TITLES (Crisp, High Contrast, Guaranteed Foreground) -->
  <g transform="translate(70, 75)">
    <!-- Top Category Badge Pill -->
    <g transform="translate(0, 0)">
      <rect width="270" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="16" cy="14" r="5" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="19" class="pill-text" fill="#c7d2fe">ENTERPRISE SAAS GOVERNANCE</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <g transform="translate(0, 68)">
      <text class="title">
        Awesome SaaS <tspan fill="url(#primary-glow)">Governance</tspan>
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 110)">
      <text class="subtitle">
        Curated Enterprise Platforms &amp; Open-Source Tools for SaaS Discovery,
      </text>
      <text y="26" class="subtitle">
        Spend Optimization, Shadow IT / AI Detection, and Identity Access Governance (IGA).
      </text>
    </g>

    <!-- Highlights Badges / Indicators Row -->
    <g transform="translate(0, 175)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="125" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="62" y="19" class="pill-text" text-anchor="middle" fill="#38bdf8">🛡️ SSPM &amp; IGA</text>

      <!-- Pill 2 -->
      <rect x="135" y="0" width="130" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="200" y="19" class="pill-text" text-anchor="middle" fill="#a855f7">💰 SPEND FINOPS</text>

      <!-- Pill 3 -->
      <rect x="275" y="0" width="130" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="340" y="19" class="pill-text" text-anchor="middle" fill="#34d399">🤖 SHADOW AI</text>

      <!-- Pill 4 -->
      <rect x="415" y="0" width="145" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="487" y="19" class="pill-text" text-anchor="middle" fill="#f43f5e">⚡ OPEN-SOURCE</text>
    </g>
  </g>

  <!-- Border Accent Outline -->
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#475569" stroke-width="1.2" stroke-opacity="0.4" />
</svg>
